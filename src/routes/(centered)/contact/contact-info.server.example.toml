[profile]
name = "Example Person"
photo = "../../../../static/icon-192.png"

[public]
email = "hello@example.com"
url = "https://example.com"

[private.email]
personal = "person@example.net"
work = "person@work.example"

[private.phone]
korea = "+82 10 5555 6789"
us = { value = "+1 212 555 6789", label = "US mobile", type = "cell" }

[private.address.korea]
street = "161 Sajik-ro, Jongno-gu"
city = "Seoul"
postal_code = "03045"
country = "South Korea"

# Some iPhone QR imports drop NOTE fields. This keeps the downloaded vCard note
# while representing the same value as an "Other" address in QR vCards.
[private.custom]
bank = { value = "Bank account: Example Bank 123", label = "Bank account", vcard_property = "NOTE", qr_as_address = true }

[sets]
korea = ["phone.korea", "address.korea"]
business = ["email.work", "phone.us"]
